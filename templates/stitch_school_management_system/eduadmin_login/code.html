<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .login-card {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
        }
        .input-focus-ring:focus {
            outline: none;
            border-color: #0051d5;
            box-shadow: 0 0 0 2px rgba(0, 81, 213, 0.1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-gutter bg-surface">
<!-- Background Decorative Elements -->
<div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] rounded-full bg-secondary/5 blur-[120px]"></div>
<div class="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] rounded-full bg-primary/5 blur-[120px]"></div>
</div>
<main class="w-full max-w-[440px] animate-fade-in">
<!-- Branding Header -->
<div class="flex flex-col items-center mb-xl">
<div class="w-16 h-16 bg-primary rounded-xl flex items-center justify-center mb-md">
<span class="material-symbols-outlined text-on-primary text-[40px]" data-icon="school">school</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">EduAdmin</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Management Portal Access</p>
</div>
<!-- Login Card -->
<div class="login-card bg-surface-container-lowest rounded-xl p-xl">
<form class="space-y-lg" id="loginForm">
<!-- Error Message Container -->
<div class="hidden flex items-start gap-sm p-md bg-error-container text-on-error-container rounded-lg border border-error/20" id="errorMessage">
<span class="material-symbols-outlined text-[20px]" data-icon="report">report</span>
<p class="font-body-sm text-body-sm flex-1"></p>
</div>
<!-- Success Message Container -->
<div class="hidden flex items-start gap-sm p-md bg-secondary-fixed text-on-secondary-fixed rounded-lg border border-secondary/20" id="successMessage">
<span class="material-symbols-outlined text-[20px]" data-icon="check_circle">check_circle</span>
<p class="font-body-sm text-body-sm flex-1">Login successful! Redirecting to dashboard...</p>
</div>
<!-- Email Field -->
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative">
<span class="absolute left-md top-1/2 -translate-y-1/2 material-symbols-outlined text-outline" data-icon="mail">mail</span>
<input class="w-full h-[48px] pl-[48px] pr-md bg-surface border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline/60 transition-all input-focus-ring" id="email" name="email" placeholder="admin@school.edu" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-sm">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-secondary hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="absolute left-md top-1/2 -translate-y-1/2 material-symbols-outlined text-outline" data-icon="lock">lock</span>
<input class="w-full h-[48px] pl-[48px] pr-[48px] bg-surface border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline/60 transition-all input-focus-ring" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-sm">
<input class="w-5 h-5 rounded border-outline-variant text-secondary focus:ring-secondary cursor-pointer" id="remember" name="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer select-none" for="remember">Remember me for 30 days</label>
</div>
<!-- Submit Button -->
<button class="w-full h-[48px] bg-secondary text-on-secondary font-label-md text-label-md rounded-lg hover:bg-secondary-container transition-all active:scale-[0.98] flex items-center justify-center gap-sm" id="submitBtn" type="submit">
<span id="btnText">Sign In</span>
<div class="hidden w-5 h-5 border-2 border-on-secondary/30 border-t-on-secondary rounded-full animate-spin" id="loader"></div>
</button>
</form>
<div class="mt-xl pt-lg border-t border-outline-variant text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Authorized Personnel Only. <br/>
                    Need an account? <a class="text-secondary font-semibold hover:underline" href="#">Contact Administrator</a>
</p>
</div>
</div>
<!-- Footer Info -->
<footer class="mt-xl text-center">
<p class="font-label-sm text-label-sm text-outline">
                © 2024 EduAdmin School Systems. All rights reserved.
            </p>
<div class="flex justify-center gap-md mt-sm">
<a class="font-label-sm text-label-sm text-outline hover:text-on-surface-variant transition-colors" href="#">Privacy Policy</a>
<a class="font-label-sm text-label-sm text-outline hover:text-on-surface-variant transition-colors" href="#">Terms of Service</a>
</div>
</footer>
</main>
<script>
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const loader = document.getElementById('loader');
        const togglePassword = document.getElementById('togglePassword');
        const eyeIcon = document.getElementById('eyeIcon');

        // Toggle Password Visibility
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            eyeIcon.innerText = type === 'password' ? 'visibility' : 'visibility_off';
        });

        // Form Submission Logic
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Reset states
            errorMessage.classList.add('hidden');
            successMessage.classList.add('hidden');
            
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            // Simple validation
            if (!email || !password) {
                showError('Please fill in all required fields.');
                return;
            }

            if (!isValidEmail(email)) {
                showError('Please enter a valid email address.');
                return;
            }

            // Mocking loading state
            setLoading(true);

            // Simulate API Request
            setTimeout(() => {
                setLoading(false);

                // Mock login logic: only accept specific credentials for demo
                if (email === 'admin@school.edu' && password === 'password123') {
                    showSuccess();
                    // Redirect simulation
                    setTimeout(() => {
                        alert('Identity verified. Redirecting to Dashboard...');
                        // window.location.href = '/dashboard';
                    }, 1500);
                } else {
                    showError('Invalid email or password. Please try again or contact IT support.');
                }
            }, 1200);
        });

        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function showError(message) {
            errorMessage.querySelector('p').innerText = message;
            errorMessage.classList.remove('hidden');
            // Shake effect
            loginForm.parentElement.classList.add('animate-[shake_0.4s_ease-in-out]');
            setTimeout(() => {
                loginForm.parentElement.classList.remove('animate-[shake_0.4s_ease-in-out]');
            }, 400);
        }

        function showSuccess() {
            successMessage.classList.remove('hidden');
            errorMessage.classList.add('hidden');
            submitBtn.classList.replace('bg-secondary', 'bg-green-600');
            btnText.innerText = 'Authenticated';
        }

        function setLoading(isLoading) {
            if (isLoading) {
                submitBtn.disabled = true;
                btnText.classList.add('hidden');
                loader.classList.remove('hidden');
                submitBtn.classList.add('opacity-90', 'cursor-not-allowed');
            } else {
                submitBtn.disabled = false;
                btnText.classList.remove('hidden');
                loader.classList.add('hidden');
                submitBtn.classList.remove('opacity-90', 'cursor-not-allowed');
            }
        }
    </script>
<style>
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
        }
        .animate-\[shake_0\.4s_ease-in-out\] {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</body></html>
